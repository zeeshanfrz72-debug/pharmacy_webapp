{% extends "ledger/base.html" %}
{% load static %}

{% block title %}Login | Pharmacy Ledger{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 60px auto; text-align: center;">
    <div style="margin-bottom: 24px;">
        <img src="{% static 'ledger/images/white logo with bg.png' %}" alt="Logo" style="width: 80px; height: 80px; border-radius: 50%; box-shadow: var(--shadow);">
        <h2 style="color: var(--brand); margin-top: 16px;">Welcome Back</h2>
        <p style="color: var(--muted); font-size: 14px;">Sign in to manage the ledger</p>
    </div>

    <div class="panel" style="text-align: left; padding: 24px;">
        <form method="post">
            {% csrf_token %}
            <div class="transaction-field" style="margin-bottom: 16px;">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" required autofocus placeholder="Enter your username">
            </div>
            
            <div class="transaction-field" style="margin-bottom: 24px;">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" required placeholder="Enter your password">
            </div>
            
            <button type="submit" style="width: 100%; padding: 12px; font-size: 16px;">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}
