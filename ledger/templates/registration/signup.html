{% extends "ledger/base.html" %}
{% load static %}

{% block title %}Sign Up | Pharmacy Ledger{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 60px auto; text-align: center;">
    <div style="margin-bottom: 24px;">
        <img src="{% static 'ledger/images/white logo with bg.png' %}" alt="Logo" style="width: 80px; height: 80px; border-radius: 50%; box-shadow: var(--shadow);">
        <h2 style="color: var(--brand); margin-top: 16px;">Create Account</h2>
        <p style="color: var(--muted); font-size: 14px;">Sign up to start managing your ledger</p>
    </div>

    <div class="panel" style="text-align: left; padding: 24px;">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" style="width: 100%; padding: 12px; font-size: 16px; margin-top: 16px;">Create Account</button>
        </form>
        <p class="muted" style="margin-top:20px; text-align: center;">
            Already have an account? <a href="{% url 'login' %}" style="color: var(--brand); font-weight: bold; text-decoration: none;">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
