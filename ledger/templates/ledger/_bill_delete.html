{% load bilingual %}
{% if bill.creation_batch_id %}
<details class="batch-action" data-action="delete" data-title="Delete bill and linked payments?" data-description="Move bill {{ bill.display_reference }} for {{ bill.firm.name }} to Trash. Affected transactions: #{{ bill.delete_ids }} ({{ bill.delete_count }} total). Change to current debt: {{ bill.delete_effect }}. The entire affected group can be recovered together at any time. Previously deleted payments stay deleted. Membership is checked again when you confirm." data-description-ur="{% bi_format_urdu 'bill_delete' bill=bill.display_reference firm=bill.firm.name ids=bill.delete_ids count=bill.delete_count amount=bill.delete_effect %}">
    <summary class="delete-action">{% bi 'Delete' %}</summary>
    <form method="post" action="{% url 'ledger:delete_bill' bill.pk %}" class="batch-action-form">
        {% csrf_token %}<input type="hidden" name="next" value="{{ bill_return_url|default:request.path }}">
        <p>{% bi_format 'bill_delete_short' ids=bill.delete_ids amount=bill.delete_effect %}</p>
        <label for="bill-delete-{{ bill.pk }}">{% bi 'Reason for deleting' %}</label><input id="bill-delete-{{ bill.pk }}" name="reason" required maxlength="500">
        <button type="submit" class="delete-action">{% bi 'Delete bill and payments' %}</button>
    </form>
</details>
{% else %}<span class="muted">{% bi 'No linked transaction' %}</span>{% endif %}
