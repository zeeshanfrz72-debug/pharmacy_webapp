{% extends "ledger/base.html" %}

{% block title %}Ledger History | Pharmacy Ledger{% endblock %}

{% block content %}
<div class="panel compact-panel ledger-history-panel">
    <div class="ledger-history-header">
        <h2>Transaction History</h2>
        <form method="get" class="ledger-history-filter-form">
            <div class="ledger-history-filter-group">
                <label for="start_date">From</label>
                <input type="date" id="start_date" name="start_date" value="{{ start_date }}">
            </div>
            <div class="ledger-history-filter-group">
                <label for="end_date">To</label>
                <input type="date" id="end_date" name="end_date" value="{{ end_date }}">
            </div>
            <div class="ledger-history-filter-actions">
                <button type="submit">Apply</button>
                <a class="button-link" href="{% url 'ledger:ledger_history' %}">Clear</a>
            </div>
        </form>
    </div>
    <div id="history-card-container">
        {% include 'ledger/_history_table.html' %}
    </div>
</div>
{% endblock %}
